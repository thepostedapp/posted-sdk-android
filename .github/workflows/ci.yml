name: ci
on:
  pull_request: {}
  push: { branches: [main] }
jobs:
  static:                       # mirrors scripts/static-check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }   # v3 defaults to 'tools platform-tools'; legacy 'tools' no longer resolves
      - uses: gradle/actions/setup-gradle@v4   # caches ~/.gradle deps + build cache; key auto-invalidates on gradle file changes
      - name: install detekt
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o detekt.zip https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7.zip
          unzip -q detekt.zip -d "$HOME/detekt"
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$(find "$HOME/detekt" -name detekt-cli -type f | head -1)" > "$HOME/bin/detekt"
          chmod +x "$HOME/bin/detekt"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: bash scripts/static-check.sh
  build:                        # type-aware detekt + full Gradle build (needs Android SDK)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }   # v3 defaults to 'tools platform-tools'; legacy 'tools' no longer resolves
      - uses: gradle/actions/setup-gradle@v4   # caches ~/.gradle deps + build cache; key auto-invalidates on gradle file changes
      - run: ./gradlew detekt assembleRelease lint testDebugUnitTest
