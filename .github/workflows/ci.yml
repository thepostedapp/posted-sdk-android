name: ci
on:
  pull_request: {}
  push: { branches: [main] }
jobs:
  static:                       # mirrors scripts/static-check.sh (provisions detekt+ktlint on PATH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: install detekt + ktlint
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o detekt.zip https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7.zip
          unzip -q detekt.zip -d "$HOME/detekt"
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$(find "$HOME/detekt" -name detekt-cli -type f | head -1)" > "$HOME/bin/detekt"
          chmod +x "$HOME/bin/detekt"
          curl -sSL -o "$HOME/bin/ktlint" https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x "$HOME/bin/ktlint"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: bash scripts/static-check.sh
  build:                        # type-aware detekt + full Gradle build (needs Android SDK)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: ./gradlew detekt assembleRelease lint testDebugUnitTest
